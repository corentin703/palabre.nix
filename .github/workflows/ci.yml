name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: palabre
          # Pousse dans le cache ce que ce job construit. Sans le secret (pull request d'un fork),
          # il ne fait que lire le cache.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Checks (formatting, module evaluation, landing page build and tests)
        run: nix flake check --print-build-logs
      - name: Landing page package (the one hosts download from the cache)
        run: nix build --print-build-logs --no-link .#palabre-landing
      - name: pin-oci.lock matches the images the module declares
        run: nix develop --command pin-oci lock check --flake .#lock
